<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ser comercio · SelloDorado MX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Sello<span>Dorado</span> MX</span>
      </a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero" style="padding-bottom:1rem">
      <div class="hero-kicker">Comerciantes</div>
      <h1 class="section-title">Solicitud de comercio</h1>
      <p class="muted">Envía CURP, teléfono e identificación. Un admin revisará tu solicitud.</p>
    </section>

    <section class="panel" id="status-panel"><p class="meta">Cargando estado...</p></section>

    <section class="panel" id="form-panel">
      <form class="form" id="apply-form">
        <label>CURP (18 caracteres)
          <input id="curp" maxlength="18" required />
        </label>
        <label>Teléfono (10 dígitos)
          <input id="phone" maxlength="10" pattern="[0-9]{10}" required />
        </label>
        <label>Identificación oficial (imagen)
          <input id="id-image" type="file" accept="image/*" required />
        </label>
        <label>Comprobante de domicilio (imagen)
          <input id="address-image" type="file" accept="image/*" required />
        </label>
        <button class="btn btn-primary" type="submit">Enviar solicitud</button>
        <div class="form-msg" id="form-msg"></div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/merchant-apply.js"></script>
</body>
</html>
