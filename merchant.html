<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis negocios · SelloDorado MX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Sello<span>Dorado</span> MX</span>
      </a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero" style="padding-bottom:1rem">
      <div class="hero-kicker">Panel comercio</div>
      <h1 class="section-title">Mis negocios</h1>
      <p class="muted">Crea negocios, productos, ofertas por nivel y consulta tu QR.</p>
    </section>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-tab="list">Lista</button>
      <button type="button" class="tab" data-tab="create">Nuevo negocio</button>
      <button type="button" class="tab" data-tab="products">Productos</button>
      <button type="button" class="tab" data-tab="qr">QR</button>
    </div>

    <section class="panel" id="tab-list"><p class="meta">Cargando...</p></section>
    <section class="panel" id="tab-create" hidden>
      <form class="form" id="business-form">
        <label>Nombre <input id="b-name" required /></label>
        <label>Descripción <textarea id="b-desc" rows="3" required></textarea></label>
        <label>Categoría <select id="b-category" required></select></label>
        <div class="split-2">
          <label>Latitud <input id="b-lat" type="number" step="any" required value="19.4326" /></label>
          <label>Longitud <input id="b-lon" type="number" step="any" required value="-99.1332" /></label>
        </div>
        <label>WhatsApp (10 dígitos) <input id="b-wa" maxlength="10" pattern="[0-9]{10}" required /></label>
        <label>Historia <textarea id="b-story" rows="2"></textarea></label>
        <div class="split-2">
          <label>Familias impactadas <input id="b-families" type="number" min="0" /></label>
          <label>Causa de impacto <input id="b-cause" /></label>
        </div>
        <label>Fotos <input id="b-photos" type="file" accept="image/*" multiple /></label>
        <label>Recompensas JSON (opcional)
          <textarea id="b-rewards" rows="3" placeholder='[{"offerText":"Postre gratis","requiredLevel":2}]'></textarea>
        </label>
        <button class="btn btn-primary" type="submit">Publicar negocio</button>
        <div class="form-msg" id="b-msg"></div>
      </form>
    </section>
    <section class="panel" id="tab-products" hidden>
      <form class="form" id="product-form">
        <label>Negocio <select id="p-business" required></select></label>
        <label>Nombre <input id="p-name" required /></label>
        <label>Descripción <textarea id="p-desc" rows="2" required></textarea></label>
        <label>Precio <input id="p-price" type="number" min="0" step="0.01" required /></label>
        <label>Fotos <input id="p-photos" type="file" accept="image/*" multiple /></label>
        <button class="btn btn-primary" type="submit">Agregar producto</button>
        <div class="form-msg" id="p-msg"></div>
      </form>
      <div id="products-list" style="margin-top:1rem"></div>
    </section>
    <section class="panel" id="tab-qr" hidden>
      <label class="form">Negocio
        <select id="qr-business"></select>
      </label>
      <button type="button" class="btn btn-primary" id="qr-load">Ver QR</button>
      <div id="qr-result" style="margin-top:1rem"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/merchant.js"></script>
</body>
</html>
