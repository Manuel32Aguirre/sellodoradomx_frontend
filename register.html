<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta · SelloDorado MX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Sello<span>Dorado</span> MX</span>
      </a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Crear cuenta</h1>
      <p>Únete para explorar y apoyar negocios locales de la CDMX. Te enviaremos un correo de confirmación.</p>
      <form class="form" id="register-form">
        <label>Nombre
          <input id="name" type="text" required />
        </label>
        <label>Apellido
          <input id="lastname" type="text" required />
        </label>
        <label>Correo
          <input id="email" type="email" required />
        </label>
        <label>Contraseña (mín. 8)
          <input id="password" type="password" required minlength="8" />
        </label>
        <button class="btn btn-primary" type="submit">Registrarme</button>
        <div class="form-msg" id="form-msg"></div>
      </form>
      <div class="auth-switch">
        ¿Ya tienes cuenta? <a href="login.html">Entrar</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
